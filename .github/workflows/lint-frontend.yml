name: lint-frontend
run-name: ${{ github.actor }} is learning GitHub Actions
on:
  push:
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g htmlhint stylelint eslint
      - run: npx htmlhint app/src/main/resources/static/assets/pages/*.html
      - run: npx stylelint app/src/main/resources/static/assets/css/*.css
      - run: npx eslint app/src/main/resources/static/assets/js/*.js
