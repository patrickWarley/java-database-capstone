name: Lint Frontend

on: [push, pull_request]

jobs:
  lint-frontend:
    runs-on: ubuntu-latest
    name: Lint HTML, CSS, and JS
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install linters
        run: |
          npm install -g htmlhint stylelint stylelint-config-standard
          
      - name: Install eslint
        run: npm install -g eslint @eslint/js globals eslint-plugin-react

      
      - name: Lint HTML
        run: htmlhint ./app/src/main/resources/static/pages/*.html || true

      - name: Lint CSS
        run: stylelint ./app/src/main/resources/static/assets/css/*.css || true

      - name: Lint JS
        run: |
          cd app
          eslint ./src/main/resources/static/js/*.js || true
